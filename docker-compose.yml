
services:
  db:
    image: postgres:17-alpine
    container_name: spendpilot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: spendpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: spendpilot_db

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U spendpilot -d spendpilot_db
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
